# Take the user manager out of systemd-oomd's kill policy, so that the compositor is never
# a candidate: Ubuntu's systemd-oomd package marks user@.service with
# ManagedOOMMemoryPressure=kill (10-oomd-user-service-defaults.conf in this directory under
# /usr/lib), which makes every cgroup of the session a candidate, Hyprland's included.
# Drop-ins are applied in file-name order, so this one, sorted after Ubuntu's, wins.
# The user's apps stay killable through app.slice (/usr/lib/systemd/user/app.slice.d/10-oomd.conf).
[Service]
ManagedOOMMemoryPressure=auto
