# Blueman's applet starts from its XDG autostart file once graphical-session.target is reached,
# while Hyprland starts the shell, which owns org.freedesktop.Notifications. When the applet's
# connection notifier asks GetCapabilities before the shell has registered that name, Blueman
# shows its fallback dialog, which has no buttons and never times out ("<device> Connected" in
# the middle of the screen). Wait for the notification server, at most 15 seconds; the leading
# "-" starts the applet anyway after the timeout.
[Service]
ExecStartPre=-/usr/bin/gdbus wait --session --timeout 15 org.freedesktop.Notifications
