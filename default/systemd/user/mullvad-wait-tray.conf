# Mullvad's window program, mullvad-gui, starts from its XDG autostart file once
# graphical-session.target is reached, while Hyprland starts the shell, which owns
# org.kde.StatusNotifierWatcher. mullvad-gui adds its tray icon once, so when it asks before the
# shell has registered that name, it runs with no icon until it is restarted. Wait for the tray, at
# most 30 seconds; the leading "-" starts Mullvad anyway after the timeout. systemd reads this file
# only for Mullvad's autostart unit, which exists only with Mullvad set to launch at login.
[Service]
ExecStartPre=-/usr/bin/gdbus wait --session --timeout 30 org.kde.StatusNotifierWatcher
