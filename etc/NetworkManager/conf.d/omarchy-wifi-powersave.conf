# Keep Wi-Fi power save off: it trades 20-300ms latency spikes on idle links
# for a fraction of a watt while the radio idles, and broken firmware (Intel
# BE200/BE211) drops the link outright when it naps.
#
# Ubuntu's network-manager ships /etc/NetworkManager/conf.d/
# default-wifi-powersave-on.conf with wifi.powersave = 3 (on). NetworkManager
# reads conf.d files in order, later ones overriding earlier ones, and this
# file's name sorts after Ubuntu's, so its value wins.
[connection]
wifi.powersave = 2
