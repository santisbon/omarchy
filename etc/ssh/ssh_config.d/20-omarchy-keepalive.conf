# Omarchy: notice dropped connections quickly instead of hanging until TCP
# times out, so the shell's ssh wrapper (default/bash/fns/ssh-reconnect) can
# clean up the terminal and reconnect. Settings in ~/.ssh/config take
# precedence over these defaults: ssh reads that file first and keeps the first
# value it gets for each option. Ubuntu's /etc/ssh/ssh_config includes this
# directory (Include /etc/ssh/ssh_config.d/*.conf) before its own Host * block.
Host *
  ServerAliveInterval 15
  ServerAliveCountMax 3
  ConnectTimeout 10
