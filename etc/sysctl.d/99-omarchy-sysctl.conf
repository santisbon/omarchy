# Solve common flakiness with SSH (MTU discovery on flaky links).
#
# Some networks drop the ICMP "fragmentation needed" messages that path MTU discovery relies on
# (some VPNs, hotel and mobile hotspots), so large packets vanish and a connection stalls once
# data flows. With probing on, the kernel notices the loss and retries with smaller packets; it
# changes nothing on networks that work. Ubuntu leaves it off (0). Omarchy's file also tunes the
# kernel for swap on zram, which this distro does not use; only this line is kept.
net.ipv4.tcp_mtu_probing=1
