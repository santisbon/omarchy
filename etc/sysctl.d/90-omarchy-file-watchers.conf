# Raise inotify limits so VS Code, webpack, and similar dev tools don't hit the
# default 8192 ceiling.
fs.inotify.max_user_watches=524288
#
# Ubuntu's localsearch (the GNOME file indexer, pulled in by Files) ships
# /usr/lib/sysctl.d/30-localsearch.conf with fs.inotify.max_user_watches = 65536.
# The kernel sizes the limit from RAM (1%, up to 1048576), so on any machine with
# more than about 8 GB that file lowers it. This file's name sorts after it and wins.
#
# The kernel's limit of 128 inotify instances per user is separate from the limit
# on watches above. The shell holds one instance for each file a FileView watches,
# and with VS Code and a second shell that reaches 128, after which inotify_init
# fails with "Too many open files".
fs.inotify.max_user_instances=1024
